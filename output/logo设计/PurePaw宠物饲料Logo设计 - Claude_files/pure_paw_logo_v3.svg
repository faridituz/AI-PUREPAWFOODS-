<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <title>Pure Paw Halal Logo</title>
  <desc>Pure Paw halal pet nutrition brand logo - vector format</desc>

  <!-- Background circle -->
  <circle cx="250" cy="250" r="230" fill="#F0F9F5"/>
  <circle cx="250" cy="250" r="220" fill="none" stroke="#1D9E75" stroke-width="2.5"/>
  <circle cx="250" cy="250" r="228" fill="none" stroke="#1D9E75" stroke-width="0.8" opacity="0.4"/>

  <!-- Left toe bean -->
  <ellipse cx="190" cy="168" rx="30" ry="35" fill="#1D9E75"/>

  <!-- Center toe bean with crescent cutout -->
  <ellipse cx="250" cy="150" rx="30" ry="35" fill="#1D9E75"/>
  <ellipse cx="250" cy="150" rx="19" ry="22" fill="#F0F9F5"/>
  <ellipse cx="260" cy="147" rx="15.5" ry="18.5" fill="#1D9E75"/>

  <!-- Right toe bean -->
  <ellipse cx="310" cy="168" rx="30" ry="35" fill="#1D9E75"/>

  <!-- 5-pointed star using precise path (outer r=9, inner r=4, 5 points) -->
  <!-- Center at (293, 122) -->
  <path d="
    M 293,113
    L 295.6,119.8
    L 302.6,119.8
    L 297.0,124.2
    L 299.1,131.0
    L 293,127.0
    L 286.9,131.0
    L 289.0,124.2
    L 283.4,119.8
    L 290.4,119.8
    Z"
    fill="#0F6E56"/>

  <!-- Main palm pad -->
  <ellipse cx="250" cy="258" rx="58" ry="67" fill="#1D9E75"/>
  <ellipse cx="242" cy="250" rx="20" ry="24" fill="#0F6E56" opacity="0.22"/>

  <!-- PURE PAW text inside circle -->
  <text
    x="250"
    y="368"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="36"
    font-weight="700"
    letter-spacing="9"
    fill="#085041">PURE PAW</text>

  <!-- Decorative lines -->
  <line x1="90" y1="386" x2="170" y2="386" stroke="#1D9E75" stroke-width="0.9" opacity="0.6"/>
  <line x1="330" y1="386" x2="410" y2="386" stroke="#1D9E75" stroke-width="0.9" opacity="0.6"/>

  <!-- Tagline -->
  <text
    x="250"
    y="400"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="11"
    letter-spacing="3"
    fill="#1D9E75">HALAL PET NUTRITION</text>

  <!-- Halal badge -->
  <rect x="178" y="416" width="144" height="28" rx="14" fill="#1D9E75"/>
  <text
    x="250"
    y="435"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="12"
    font-weight="600"
    letter-spacing="1.5"
    fill="#E1F5EE">حلال · HALAL</text>

</svg>
